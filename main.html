<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vortex Project — Koleksi Proyek</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app" class="app-show">

    <nav class="page-nav">
      <div class="page-nav-brand">
        <span class="page-nav-mark"></span>
        <span>Vortex<span class="logo-accent">Project</span></span>
      </div>
      <div class="page-nav-links">
        <a href="index.html" class="page-nav-link">Beranda</a>
        <a href="main.html" class="page-nav-link page-nav-active">Proyek</a>
      </div>
    </nav>

    <h1 class="page-title">Koleksi Script</h1>

    <header class="header">
      <div class="search-bar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <input type="text" id="searchInput" placeholder="Cari nama proyek..." />
      </div>
    </header>

    <p class="result-count" id="resultCount"></p>

    <section class="grid" id="grid"></section>

    <p class="empty-state" id="emptyState" hidden>Tidak ada proyek yang cocok.</p>

  </div>

  <!-- Popup Detail Script -->
  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Tutup">&times;</button>

      <h3 class="modal-name" id="modalName"></h3>

      <div class="modal-field">
        <span class="modal-label">Code Type</span>
        <div class="modal-codetypes" id="modalCodeTypes"></div>
      </div>

      <div class="modal-field">
        <span class="modal-label">Note</span>
        <p class="modal-note" id="modalNote"></p>
      </div>

      <a href="#" id="modalLink" class="modal-link-btn" target="_blank" rel="noopener noreferrer">
        Buka Link →
      </a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
